{% extends 'registration/auth_base.html' %}{% block auth_content %}{% if validlink %}<h2>Wähle ein neues Passwort.</h2><form method='post'>{% csrf_token %}<div class='auth-fields'>{{ form.as_div }}</div><button class='button button-primary' type='submit'>Passwort speichern</button></form>{% else %}<h2>Dieser Link ist abgelaufen.</h2><p class='auth-description'>Fordere einen neuen Link an, um dein Passwort zurückzusetzen.</p><a class='button' href="{% url 'password_reset' %}">Neuen Link anfordern</a>{% endif %}{% endblock %}
