{% extends 'base.html' %}{% block title %}Monat löschen{% endblock %}{% block content %}<section class="simple-card"><p class="eyebrow">DEIN GESPEICHERTES BUDGET</p><h1>Monat löschen?</h1><p>Dein Budget für <strong>{{ record.month|date:'F Y' }}</strong> wird dauerhaft gelöscht. Deine anderen Monate bleiben erhalten.</p><form method="post">{% csrf_token %}<div class="dialog-actions"><a class="button" href="{% url 'dashboard' %}?month={{ record.month|date:'Y-m' }}">Abbrechen</a><button class="button button-danger" type="submit">Ja, Monat löschen</button></div></form></section>{% endblock %}
