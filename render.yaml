# Paid production baseline. Review Render's current pricing before applying.
services:
  - type: web
    name: mehr-uebrig
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: mehr-uebrig-db
          property: connectionString
databases:
  - name: mehr-uebrig-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    diskSizeGB: 5
    databaseName: mehr_uebrig
    user: mehr_uebrig
    ipAllowList: []
