name: Django + PostgreSQL
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mehr_uebrig
          POSTGRES_USER: mehr_uebrig
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mehr_uebrig -d mehr_uebrig"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-key-with-more-than-fifty-characters
      DJANGO_DEBUG: '1'
      POSTGRES_DB: mehr_uebrig
      POSTGRES_USER: mehr_uebrig
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - run: node --test tests/calculator.test.cjs
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_TRUST_PROXY: '1'
